<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!--
    Placeholder hero: a stylised padel court seen from above, in the club's palette.
    TODO(pitch): replace with a real photo of Padel House's courts.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#17553f"/>
      <stop offset="55%" stop-color="#0f3d2e"/>
      <stop offset="100%" stop-color="#071f17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.22" r="0.75">
      <stop offset="0%" stop-color="#1f6d51" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b2c21" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ballFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f78f"/>
      <stop offset="100%" stop-color="#c2db32"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- court, in perspective -->
  <g stroke="#d9f24a" stroke-opacity="0.22" fill="none" stroke-width="3">
    <path d="M300 880 L620 300 L1080 300 L1420 880 Z"/>
    <path d="M360 770 L1360 770"/>
    <path d="M470 570 L1240 570"/>
    <path d="M850 300 L850 880" stroke-opacity="0.14"/>
    <path d="M410 670 L1300 670" stroke-opacity="0.14"/>
  </g>

  <!-- net -->
  <g stroke="#faf9f5" stroke-opacity="0.3">
    <path d="M410 672 L1300 672" stroke-width="5"/>
    <g stroke-width="1.4" stroke-opacity="0.16">
      <path d="M470 640 L470 700"/><path d="M580 640 L580 700"/><path d="M690 640 L690 700"/>
      <path d="M800 640 L800 700"/><path d="M910 640 L910 700"/><path d="M1020 640 L1020 700"/>
      <path d="M1130 640 L1130 700"/><path d="M1240 640 L1240 700"/>
    </g>
  </g>

  <!-- ball -->
  <circle cx="1180" cy="232" r="120" fill="#d9f24a" opacity="0.1" filter="url(#soft)"/>
  <circle cx="1180" cy="232" r="34" fill="url(#ballFade)"/>
  <path d="M1150 214 a52 52 0 0 1 0 36" stroke="#0f3d2e" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>
  <path d="M1210 214 a52 52 0 0 0 0 36" stroke="#0f3d2e" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>

  <!-- foliage suggestion: the club's "zelena zona" -->
  <g fill="#071f17" opacity="0.5">
    <ellipse cx="120" cy="960" rx="260" ry="150"/>
    <ellipse cx="1520" cy="930" rx="230" ry="170"/>
  </g>
  <g fill="#0b2c21" opacity="0.6">
    <ellipse cx="-20" cy="240" rx="220" ry="260"/>
  </g>
</svg>
